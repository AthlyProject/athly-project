# Bundle ID vem de Config/Config.xcconfig (default: com.athly.runner).
# Se outro dev tiver "cannot be registered to your development team", criar Config/User.xcconfig
# com ATHLY_BUNDLE_ID = com.athly.runner.dev e adicionar Config/User.xcconfig ao .gitignore.
name: AthlyRunner
options:
  bundleIdPrefix: com.athly
  deploymentTarget:
    iOS: "16.1"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

packages:
  FITSwiftSDK:
    url: https://github.com/garmin/fit-swift-sdk.git
    exactVersion: "21.205.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"          # 5.x: SDK + RevenueCatUI (Paywalls v2 + Customer Center)
  opentelemetry-swift:
    url: https://github.com/open-telemetry/opentelemetry-swift
    from: "1.10.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"          # Login social com Google

# Variáveis definidas nas configFiles (ex: User.xcconfig) ficam disponíveis como build settings.
# DEV_API_URL é definido em Config/User.xcconfig (gitignored) para testes no device físico.

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "8C9GB8F87Q"
    CODE_SIGN_STYLE: Automatic

targets:
  AthlyRunner:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: AthlyRunner
        excludes:
          - "Info.plist"
      # Shared model — included in both app and extension
      - path: AthlyRunnerLiveActivity/AthlyRunnerAttributes.swift
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATHLY_BUNDLE_ID)
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: AthlyRunner/Info.plist
      properties:
        DEV_API_URL: "$(DEV_API_URL)"
        REVENUECAT_API_KEY: "$(REVENUECAT_API_KEY)"
        OTEL_ENDPOINT: "$(OTEL_ENDPOINT)"
        OTEL_API_KEY: "$(OTEL_API_KEY)"
        # Login com Google (GoogleSignIn lê GIDClientID; o URL scheme recebe o callback OAuth).
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"
        CFBundleDisplayName: Athly
        CFBundleDevelopmentRegion: pt-BR
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - armv7
          - location-services
          - gps
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Athly precisa da sua localizacao para registrar o percurso da corrida em tempo real."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Athly precisa de acesso continuo a localizacao para rastrear sua corrida mesmo com a tela bloqueada."
        NSLocationAlwaysUsageDescription: "Athly precisa de acesso continuo a localizacao para rastrear sua corrida em segundo plano."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHealthShareUsageDescription: "O Athly le treinos de corrida do Apple Health para exibir suas atividades na tela de integracao."
        NSHealthUpdateUsageDescription: "O Athly salva suas corridas no Apple Health para manter seu historico de atividades atualizado."
        NSCameraUsageDescription: "O Athly usa a camera para criar fotos com a marca d'agua dos resultados do seu treino."
        NSPhotoLibraryAddUsageDescription: "O Athly salva na sua galeria as fotos com a marca d'agua do treino."
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
          - location
        UIAppFonts:
          - SpaceGrotesk-Light.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
    entitlements:
      path: AthlyRunner/AthlyRunner.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - target: AthlyRunnerLiveActivity
        embed: true
      - package: FITSwiftSDK
        product: FITSwiftSDK
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: opentelemetry-swift
        product: OpenTelemetryApi
      - package: opentelemetry-swift
        product: OpenTelemetrySdk
      - package: opentelemetry-swift
        product: OpenTelemetryProtocolExporterHTTP
      - package: opentelemetry-swift
        product: URLSessionInstrumentation
      - package: opentelemetry-swift
        product: ResourceExtension
      - package: GoogleSignIn
        product: GoogleSignIn

  AthlyRunnerLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: AthlyRunnerLiveActivity
      - path: AthlyRunner/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATHLY_BUNDLE_ID).liveactivity
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
    info:
      path: AthlyRunnerLiveActivity/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AthlyRunnerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: AthlyRunnerTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.athly.runner.tests
    dependencies:
      - target: AthlyRunner
      - package: FITSwiftSDK
        product: FITSwiftSDK

schemes:
  AthlyRunner:
    build:
      targets:
        AthlyRunner: all
        AthlyRunnerTests: [test]
    test:
      targets:
        - AthlyRunnerTests
