version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: node dist/src/main.js
  network:
    port: 4000
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "4000"
    # IMPORTANT: Do not commit actual secrets below. Use App Runner Console to set secure values safely.
    - name: GEMINI_API_KEY
      value: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:GEMINI_API_KEY"
    # Database (AWS RDS)
    - name: DATABASE_URL
      value: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:DATABASE_URL"
