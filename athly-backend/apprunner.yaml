version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: npm run start:prod:migrate
  network:
    port: 4000
  env:
    - name: NODE_ENV
      value: production
    - name: OTEL_SERVICE_NAME
      value: "athly-backend"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.namespace=athly,deployment.environment=production"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "https://otlp-gateway-prod-eu-west-2.grafana.net/otlp"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
    - name: OTEL_LOGS_EXPORTER
      value: "otlp"
    - name: OTEL_METRICS_EXPORTER
      value: "otlp"
    - name: OTEL_NODE_RESOURCE_DETECTORS
      value: "env,host,os"
    - name: APNS_TEAM_ID
      value: "8C9GB8F87Q"
    - name: APNS_TOPIC
      value: "com.athly.runner"
    - name: AWS_REGION
      value: "eu-central-1"
    - name: AWS_SQS_PLAN_GENERATION_QUEUE_URL
      value: "https://sqs.eu-central-1.amazonaws.com/730335545778/training-plan-generation"
  secrets:
    - name: GEMINI_API_KEY
      value-from: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:GEMINI_API_KEY::"
    - name: DATABASE_URL
      value-from: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:DATABASE_URL::"
    - name: OTEL_EXPORTER_OTLP_HEADERS
      value-from: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:OTEL_EXPORTER_OTLP_HEADERS::"
    - name: PAYWALL_ENABLED
      value-from: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:PAYWALL_ENABLED::"
    - name: REVENUECAT_WEBHOOK_AUTH
      value-from: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:REVENUECAT_WEBHOOK_AUTH::"
    - name: APPLE_CLIENT_ID
      value-from: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:APPLE_CLIENT_ID::"
    - name: GOOGLE_IOS_CLIENT_ID
      value-from: "arn:aws:secretsmanager:eu-central-1:730335545778:secret:prod/BackEnd/Athly-bdsWXr:GOOGLE_IOS_CLIENT_ID::"
